envVarGroups:
  - name: svc-serviceflow-production
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: INVITATION_TTL_HOURS
        value: "24"
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USE_SSL
        value: "false"
      - key: MAIL_FROM
        sync: false

services:
  - type: pserv
    name: svc-serviceflow-api
    runtime: docker
    region: oregon
    plan: starter
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    startCommand: >-
      sh -c "alembic upgrade head && python -m app.seed --production &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    disk:
      name: svc-serviceflow-uploads
      mountPath: /app/data/documents
      sizeGB: 10
    envVars:
      - fromGroup: svc-serviceflow-production
      - key: DATABASE_URL
        fromDatabase:
          name: svc-serviceflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: svc-serviceflow-redis
          property: connectionString
      - key: SEED_ADMIN_EMAIL
        sync: false
      - key: SEED_ADMIN_NAME
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false

  - type: web
    name: svc-serviceflow-web
    runtime: docker
    region: oregon
    plan: starter
    dockerContext: .
    dockerfilePath: ./frontend/Dockerfile
    envVars:
      - key: API_INTERNAL_HOSTPORT
        fromService:
          type: pserv
          name: svc-serviceflow-api
          property: hostport

  - type: worker
    name: svc-serviceflow-worker
    runtime: docker
    region: oregon
    plan: starter
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    startCommand: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
    envVars:
      - fromGroup: svc-serviceflow-production
      - key: DATABASE_URL
        fromDatabase:
          name: svc-serviceflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: svc-serviceflow-redis
          property: connectionString

  - type: worker
    name: svc-serviceflow-beat
    runtime: docker
    region: oregon
    plan: starter
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    startCommand: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
    envVars:
      - fromGroup: svc-serviceflow-production
      - key: DATABASE_URL
        fromDatabase:
          name: svc-serviceflow-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: svc-serviceflow-redis
          property: connectionString

  - type: keyvalue
    name: svc-serviceflow-redis
    region: oregon
    plan: starter
    maxmemoryPolicy: noeviction

databases:
  - name: svc-serviceflow-db
    region: oregon
    plan: basic-256mb
    databaseName: svc_serviceflow
    user: svc_serviceflow
