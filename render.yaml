services:
  - type: web
    name: svc-serviceflow-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        value: postgresql+asyncpg://neondb_owner:npg_uCiwcfSeM72X@ep-sweet-hat-bdz1ed5d-pooler.c-8.us-east-2.aws.neon.tech/neondb?ssl=require
      - key: JWT_SECRET
        value: local-development-secret-change-this-2026-svc-infosystems
      - key: REDIS_URL
        value: memory://
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://svc-serviceflow.ayush-8a3.workers.dev
