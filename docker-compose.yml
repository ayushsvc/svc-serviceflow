services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@svcinfosys.in
      CORS_ORIGINS: http://localhost:3000
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD}
      SEED_REQUESTER_PASSWORD: ${SEED_REQUESTER_PASSWORD}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports: ["3000:3000"]
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svc}
      POSTGRES_USER: ${POSTGRES_USER:-svc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [svc-postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U svc -d svc"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    volumes: [svc-redis:/data]
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@svcinfosys.in
    depends_on: [db, redis]
    command: celery -A app.workers.celery_app.celery_app worker --loglevel=INFO
  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      MAIL_FROM: no-reply@svcinfosys.in
    depends_on: [db, redis]
    command: celery -A app.workers.celery_app.celery_app beat --loglevel=INFO
  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports: ["18025:8025"]
volumes:
  svc-postgres:
  svc-redis:
