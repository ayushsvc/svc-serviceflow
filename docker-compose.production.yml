# Consolidated Production Docker Compose for SVC ServiceFlow
# Runs the entire stack on a single low-cost VPS ($4-$6/mo) with minimal memory footprint (<400MB RAM)
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_HOSTPORT: api:8000
    depends_on:
      - api

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-memory://}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
      MAIL_FROM: ${MAIL_FROM}
      APP_BASE_URL: ${APP_BASE_URL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_TECHNICIAN_PASSWORD: ${SEED_TECHNICIAN_PASSWORD}
      SEED_REQUESTER_PASSWORD: ${SEED_REQUESTER_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS}
    volumes:
      - svc-uploads:/app/data/documents
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && python -m app.seed --production && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-svc}
      POSTGRES_USER: ${POSTGRES_USER:-svc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - svc-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-svc} -d ${POSTGRES_DB:-svc}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  svc-postgres:
  svc-uploads:
  caddy_data:
  caddy_config:
